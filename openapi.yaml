openapi: 3.0.3
info:
  title: RevieU API
  version: 1.0.0
  description: Auth + Customer API for RevieU
servers:
  - url: /api/v1
    description: Default API base
security:
  - bearerAuth: []
tags:
  - name: auth
  - name: users
  - name: feed
  - name: merchants
  - name: reviews
  - name: coupons
  - name: vouchers
  - name: payments
  - name: media
  - name: ai
paths: {}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    ErrorResponse:
      description: Error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
