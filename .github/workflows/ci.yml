name: RevieU CI/CD

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  IMAGE_NAME_LC: ""

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce Branch Rules
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ "$BASE_REF" == "main" && "$HEAD_REF" != "dev" ]]; then
            echo "Error: Pull Requests to 'main' must originate from the 'dev' branch."
            exit 1
          fi

          if [[ "$BASE_REF" == "dev" && "$HEAD_REF" == "main" ]]; then
            echo "Error: You cannot merge 'main' into 'dev' via PR."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm run test:run

  docker-build-push:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enforce PR-based Workflow
        shell: bash
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            # Check if this is a PR merge by looking for PR references in commit message or merge commit parents
            COMMIT_MSG=$(git log -1 --pretty=%B)
            PARENT_COUNT=$(git show -s --format=%P HEAD | wc -w)

            # Allow if: 1) It's a merge commit (2+ parents), OR 2) Commit message indicates PR merge
            if [[ $PARENT_COUNT -le 1 ]] && ! echo "$COMMIT_MSG" | grep -qiE "(merge pull request|squash.*#[0-9]+|#[0-9]+.*\(#[0-9]+\))"; then
              echo "Error: Direct pushes to 'main' are not allowed. Please use a Pull Request from 'dev'."
              exit 1
            fi
          fi

      - name: Lowercase image name
        run: |
          echo "IMAGE_NAME_LC=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        id: image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prepare infra promotion branch
        env:
          GH_TOKEN: ${{ secrets.INFRA_UPDATE_TOKEN }}
          INFRA_REPOSITORY: LosFurina/infra
          PROMOTION_BRANCH: automation/revieu-web-${{ github.ref_name }}-${{ github.sha }}
        run: |
          set -euo pipefail

          if [ -z "$GH_TOKEN" ]; then
            echo "INFRA_UPDATE_TOKEN is not configured."
            exit 1
          fi

          rm -rf infra
          git clone --branch main "https://x-access-token:${GH_TOKEN}@github.com/${INFRA_REPOSITORY}.git" infra
          cd infra
          git checkout -b "$PROMOTION_BRANCH"

      - name: Update infra workload image
        uses: mikefarah/yq@c14f446382944492701b16c1ddb48bb9dbe683e3
        env:
          IMAGE_REF: ghcr.io/revieu-corp/revieu-web:${{ github.ref_name == 'main' && 'latest' || 'dev' }}@${{ steps.image.outputs.digest }}
          WORKLOAD_FILE: ${{ github.ref_name == 'main' && 'workloads/revieu-prod/frontend.yaml' || 'workloads/revieu-dev/frontend.yaml' }}
        with:
          cmd: >-
            yq -e -i
            '(
              select(.apiVersion == "apps/v1" and .kind == "Deployment" and
              .metadata.name == "revieu-web")
              .spec.template.spec.containers[]
              | select(.name == "web")
              | .image
            ) = strenv(IMAGE_REF)'
            "infra/$WORKLOAD_FILE"

      - name: Create infra promotion pull request
        env:
          GH_TOKEN: ${{ secrets.INFRA_UPDATE_TOKEN }}
          INFRA_REPOSITORY: LosFurina/infra
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE_TAG: ${{ github.ref_name == 'main' && 'latest' || 'dev' }}
          WORKLOAD_FILE: ${{ github.ref_name == 'main' && 'workloads/revieu-prod/frontend.yaml' || 'workloads/revieu-dev/frontend.yaml' }}
          PROMOTION_BRANCH: automation/revieu-web-${{ github.ref_name }}-${{ github.sha }}
        run: |
          set -euo pipefail
          cd infra

          if git diff --quiet -- "$WORKLOAD_FILE"; then
            echo "Infra already references $IMAGE_TAG@$IMAGE_DIGEST."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$WORKLOAD_FILE"
          git commit -m "chore(revieu-${{ github.ref_name }}): promote web image"
          git push origin "$PROMOTION_BRANCH"

          PR_URL=$(gh pr create \
            --repo "$INFRA_REPOSITORY" \
            --base main \
            --head "$PROMOTION_BRANCH" \
            --title "chore(revieu-${{ github.ref_name }}): promote web image" \
            --body "Promote web image digest from commit ${{ github.sha }}. CI run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")

          if [ "${{ github.ref_name }}" = "dev" ]; then
            gh pr merge "$PR_URL" \
              --repo "$INFRA_REPOSITORY" \
              --squash \
              --delete-branch
          fi
